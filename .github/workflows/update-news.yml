// 主函数更新
async function main() {
  console.log("开始抓取财经源...");
  
  const results = await Promise.allSettled([
    getBaidu(), getBilibili(), getToutiao(), getIThome(),
    getNetease(), getWallstreet(), getJiemian(), getEastmoney(),
    getGithub(), getHuggingFace(), getTonghuashun()  // 新增
  ]);

  const keys = [
    "baidu", "bilibili", "toutiao", "ithome",
    "netease", "wallstreet", "jiemian", "eastmoney",
    "github", "huggingface", "tonghuashun"
  ];
  
  const finalData = { updatedAt: new Date().toISOString() };

  results.forEach((result, index) => {
    const data = result.status === 'fulfilled' ? result.value : [];
    if (Array.isArray(data) && data.length > 0) {
      finalData[keys[index]] = data;
    } else {
      finalData[keys[index]] = []; // 或 fallback
    }
  });

  console.log("成功源:", Object.keys(finalData).filter(k => Array.isArray(finalData[k]) && finalData[k].length > 0));
  fs.writeFileSync("./hotnews.json", JSON.stringify(finalData, null, 2));
}

main().catch(console.error);
