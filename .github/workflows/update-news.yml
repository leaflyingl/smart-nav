name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

          // 通过免费的 Cloudflare CORS 代理绕过 GitHub 机房 IP 拦截
          async function fetchProxyJSON(url, headers = {}) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 8000);
            const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(url);
            try {
              const res = await fetch(proxyUrl, {
                signal: controller.signal,
                headers: { ...headers }
              });
              clearTimeout(id);
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              clearTimeout(id);
              return null;
            }
          }

          // 直接请求无风控 API
          async function fetchDirectJSON(url) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 8000);
            try {
              const res = await fetch(url, { signal: controller.signal });
              clearTimeout(id);
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              clearTimeout(id);
              return null;
            }
          }

          // 1. 百度热搜
          async function getBaidu() {
            const json = await fetchDirectJSON("https://top.baidu.com/api/board?tab=realtime");
            const list = json?.data?.cards?.[0]?.content || [];
            return list.slice(0, 5).map(i => ({ title: i.word, url: i.url || `https://www.baidu.com/s?wd=${encodeURIComponent(i.word)}` }));
          }

          // 2. B站热门
          async function getBilibili() {
            const json = await fetchDirectJSON("https://api.bilibili.com/x/web-interface/popular?ps=5&pn=1");
            const list = json?.data?.list || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.short_link_v2 || i.arcurl || `https://www.bilibili.com/video/${i.bvid}` }));
          }

          // 3. 今日头条
          async function getToutiao() {
            const json = await fetchDirectJSON("https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.Title, url: `https://www.toutiao.com/trending/${i.ClusterIdStr}/` }));
          }

          // 4. IT之家 (通过 CORS Proxy 代理绕过 IP 封锁)
          async function getIThome() {
            const json = await fetchProxyJSON("https://m.ithome.com/api/news/getnewslist?type=hotrank");
            const list = json?.dataList || json?.data || [];
            return list.slice(0, 5).map(i => ({
              title: i.title || i.newsTitle,
              url: i.url || `https://www.ithome.com/0/${Math.floor(i.newsid/1000)}/${i.newsid}.htm`
            }));
          }

          // 5. 网易新闻 (通过代理抓取热榜专用 API)
          async function getNetease() {
            const json = await fetchProxyJSON("https://c.m.163.com/nc/article/headline/T1348647853363/0-20.html");
            const rawList = json?.T1348647853363 || [];
            const items = [];
            for (const item of rawList) {
              if (items.length >= 5) break;
              if (item && item.title) {
                items.push({
                  title: item.title,
                  url: item.url || (item.docid ? `https://3g.163.com/touch/article/${item.docid}.html` : "https://news.163.com")
                });
              }
            }
            return items;
          }

          // 6. 华尔街见闻
          async function getWallstreet() {
            const json = await fetchProxyJSON("https://api-one-wscn.wallstreetcn.com/apiv1/content/lives?channel=global-channel&limit=10");
            const list = json?.data?.items || [];
            const items = [];
            for (const i of list) {
              if (items.length >= 5) break;
              let title = i.title || i.content_text || "";
              title = title.replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
              if (title.length > 5) {
                items.push({
                  title: title.length > 30 ? title.slice(0, 30) + "..." : title,
                  url: i.uri || "https://wallstreetcn.com/live/global"
                });
              }
            }
            return items;
          }

          // 7. 界面新闻
          async function getJiemian() {
            const json = await fetchProxyJSON("https://m.jiemian.com/index.php?m=article&a=ajaxNews&page=1");
            const list = json?.rst || json?.data || (Array.isArray(json) ? json : []);
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.ar_url || `https://www.jiemian.com/article/${i.id}.html` }));
          }

          // 8. 东方财富
          async function getEastmoney() {
            const json = await fetchProxyJSON("https://np-listapi.eastmoney.com/comm/web/getFastNewsList?client=web&biz=web_news&pageIndex=1&pageSize=5");
            const list = json?.data?.fastNewsList || [];
            return list.slice(0, 5).map(i => ({
              title: i.title || i.Title,
              url: `https://kuaixun.eastmoney.com/news/${i.code}.html`
            }));
          }

          // 9. GitHub Trending
          async function getGithub() {
            const json = await fetchDirectJSON("https://api.github.com/search/repositories?q=created:>2026-01-01&sort=stars&order=desc&per_page=5");
            const list = json?.items || [];
            return list.slice(0, 5).map(i => ({ title: `${i.full_name}: ${i.description || "无描述"}`, url: i.html_url }));
          }

          // 10. Hugging Face
          async function getHuggingFace() {
            const json = await fetchDirectJSON("https://huggingface.co/api/models?sort=downloads&direction=-1&limit=5");
            const list = Array.isArray(json) ? json : [];
            return list.map(i => ({ title: `Model: ${i.id}`, url: `https://huggingface.co/${i.id}` }));
          }

          async function main() {
            console.log("开始通过代理/直连混合抓取全量数据...");
            
            const results = await Promise.all([
              getBaidu(), getBilibili(), getToutiao(), getIThome(),
              getNetease(), getWallstreet(), getJiemian(), getEastmoney(),
              getGithub(), getHuggingFace()
            ]);

            const keys = [
              "baidu", "bilibili", "toutiao", "ithome",
              "netease", "wallstreet", "jiemian", "eastmoney",
              "github", "huggingface"
            ];
            
            const finalData = { updatedAt: new Date().toISOString() };

            keys.forEach((key, index) => {
              if (Array.isArray(results[index]) && results[index].length > 0) {
                finalData[key] = results[index];
              }
            });

            console.log("最终成功生成的源:", Object.keys(finalData).filter(k => k !== "updatedAt"));
            fs.writeFileSync("./hotnews.json", JSON.stringify(finalData, null, 2));
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data via proxy" || exit 0
          git push
