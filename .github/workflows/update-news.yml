  console.log("同花顺抓取结果类型:", typeof json);
  // TODO: 如果是HTML，用正则提取标题链接（较脆弱）
  return items.length > 0 ? items.slice(0,5) : [{title: "同花顺快讯（需进一步调试）", url: "https://news.10jqka.com.cn/realtimenews.html"}];
