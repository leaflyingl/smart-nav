name: Auto Update Hot News

on:
  schedule:
    # 每 30 分钟自动运行一次 (Cron 表达式)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许你在 GitHub 手动点击触发测试

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

          async function fetchNews(type) {
            try {
              const res = await fetch(`https://api.vvhan.com/api/hotlist/${type}`);
              const json = await res.json();
              if (json.success && Array.isArray(json.data)) {
                return json.data.slice(0, 5).map(i => ({
                  title: i.title || i.name || "最新资讯",
                  url: i.url || i.link || "#"
                }));
              }
            } catch (e) {
              console.error(`Fetch ${type} error:`, e);
            }
            return [];
          }

          async function main() {
            const data = {
              baidu: await fetchNews("baidu"),
              weibo: await fetchNews("weibo"),
              bilibili: await fetchNews("bilibili"),
              douyin: await fetchNews("douyin"),
              updatedAt: new Date().toISOString()
            };
            fs.writeFileSync("./hotnews.json", JSON.stringify(data, null, 2));
            console.log("hotnews.json updated successfully!");
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data" || exit 0
          git push
