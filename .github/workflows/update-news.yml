name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

          // 超强通用带超时 fetch
          async function getJSON(url) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 6000);
            try {
              const res = await fetch(url, {
                signal: controller.signal,
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
                }
              });
              clearTimeout(id);
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              clearTimeout(id);
              return null;
            }
          }

          // 1. 百度热搜
          async function getBaidu() {
            const json = await getJSON("https://top.baidu.com/api/board?tab=realtime");
            const list = json?.data?.cards?.[0]?.content || [];
            return list.slice(0, 5).map(i => ({ title: i.word, url: i.url || `https://www.baidu.com/s?wd=${encodeURIComponent(i.word)}` }));
          }

          // 2. B站热门
          async function getBilibili() {
            const json = await getJSON("https://api.bilibili.com/x/web-interface/popular?ps=5&pn=1");
            const list = json?.data?.list || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.short_link_v2 || i.arcurl || `https://www.bilibili.com/video/${i.bvid}` }));
          }

          // 3. 今日头条
          async function getToutiao() {
            const json = await getJSON("https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.Title, url: `https://www.toutiao.com/trending/${i.ClusterIdStr}/` }));
          }

          // 4. IT之家
          async function getIThome() {
            const json = await getJSON("https://api.vvhan.com/api/hotlist/itNews");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.url }));
          }

          // 5. 网易新闻 (彻底解决：换用 vvhan 纯净热榜接口，绝对 5 条)
          async function getNetease() {
            const json = await getJSON("https://api.vvhan.com/api/hotlist/wyNews");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.url }));
          }

          // 6. 华尔街见闻 (快讯 API)
          async function getWallstreet() {
            const json = await getJSON("https://api-one-wscn.wallstreetcn.com/apiv1/content/lives?channel=global-channel&limit=8");
            const list = json?.data?.items || [];
            const res = [];
            for (const i of list) {
              if (res.length >= 5) break;
              const title = i.title || i.content_text?.replace(/<[^>]+>/g, "").trim();
              if (title && title.length > 5) {
                res.push({ title: title.slice(0, 32) + "...", url: i.uri || "https://wallstreetcn.com/live/global" });
              }
            }
            return res;
          }

          // 7. 界面新闻 (替换为免拦截热搜节点)
          async function getJiemian() {
            const json = await getJSON("https://api.vvhan.com/api/hotlist/jiemian");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.url }));
          }

          // 8. 东方财富 (换用高稳定热榜)
          async function getEastmoney() {
            const json = await getJSON("https://api.vvhan.com/api/hotlist/eastmoney");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.url }));
          }

          // 9. GitHub Trending
          async function getGithub() {
            const json = await getJSON("https://api.github.com/search/repositories?q=created:>2026-01-01&sort=stars&order=desc&per_page=5");
            const list = json?.items || [];
            return list.slice(0, 5).map(i => ({ title: `${i.full_name}: ${i.description || "无描述"}`, url: i.html_url }));
          }

          // 10. Hugging Face
          async function getHuggingFace() {
            const json = await getJSON("https://huggingface.co/api/models?sort=downloads&direction=-1&limit=5");
            const list = Array.isArray(json) ? json : [];
            return list.map(i => ({ title: `Model: ${i.id}`, url: `https://huggingface.co/${i.id}` }));
          }

          async function main() {
            console.log("开始抓取 10 大免拦截数据源...");
            
            const results = await Promise.all([
              getBaidu(), getBilibili(), getToutiao(), getIThome(),
              getNetease(), getWallstreet(), getJiemian(), getEastmoney(),
              getGithub(), getHuggingFace()
            ]);

            const keys = [
              "baidu", "bilibili", "toutiao", "ithome",
              "netease", "wallstreet", "jiemian", "eastmoney",
              "github", "huggingface"
            ];
            
            const finalData = { updatedAt: new Date().toISOString() };

            keys.forEach((key, index) => {
              if (Array.isArray(results[index]) && results[index].length > 0) {
                finalData[key] = results[index];
              }
            });

            console.log("最终成功生成的 Key 列表:", Object.keys(finalData).filter(k => k !== "updatedAt"));
            fs.writeFileSync("./hotnews.json", JSON.stringify(finalData, null, 2));
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data" || exit 0
          git push
