name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
            const fs = require("fs");

            async function fetchWithUA(url, customHeaders = {}, retries = 3) {
              for (let attempt = 0; attempt <= retries; attempt++) {
                const controller = new AbortController();
                const id = setTimeout(() => controller.abort(), 12000);
                try {
                  const res = await fetch(url, {
                    signal: controller.signal,
                    headers: {
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
                      "Accept": "application/json, text/plain, */*",
                      "Referer": new URL(url).origin + "/",
                      ...customHeaders
                    }
                  });
                  clearTimeout(id);
                  if (!res.ok) throw new Error("HTTP " + res.status);
                  const text = await res.text();
                  try { return JSON.parse(text); } catch { return text; }
                } catch (e) {
                  clearTimeout(id);
                  if (attempt === retries) return null;
                  await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
                }
              }
              return null;
            }

            // 原有所有函数（仅优化必要部分）
            async function getBaidu() {
              const json = await fetchWithUA("https://top.baidu.com/api/board?tab=realtime");
              const list = json?.data?.cards?.[0]?.content || [];
              return list.slice(0, 5).map(i => ({ title: i.word, url: i.url || `https://www.baidu.com/s?wd=${encodeURIComponent(i.word)}` }));
            }

            async function getBilibili() {
              const json = await fetchWithUA("https://api.bilibili.com/x/web-interface/popular?ps=10&pn=1");
              const list = json?.data?.list || [];
              return list.slice(0, 5).map(i => ({ title: i.title, url: i.short_link_v2 || i.arcurl || `https://www.bilibili.com/video/${i.bvid}` }));
            }

            async function getToutiao() { /* 同上 */ 
              const json = await fetchWithUA("https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc");
              const list = json?.data || [];
              return list.slice(0, 5).map(i => ({ title: i.Title, url: `https://www.toutiao.com/trending/${i.ClusterIdStr}/` }));
            }

            async function getIThome() { /* 同上 */ 
              const json = await fetchWithUA("https://api.ithome.com/json/newslist/news", {"Referer": "https://www.ithome.com/"});
              let list = Array.isArray(json) ? json : (json?.newslist || []);
              return list.slice(0, 5).map(i => ({ title: i.title, url: i.url || `https://www.ithome.com/0/${Math.floor(i.newsid/1000)}/${i.newsid}.htm` }));
            }

            async function getNetease() {
              const json = await fetchWithUA("https://c.m.163.com/nc/article/headline/T1348647853363/0-40.html");
              let rawList = json?.T1348647853363 || json?.list || [];
              const items = [];
              for (const item of rawList) {
                if (item?.title && items.length < 5 && item.title.length > 5) {
                  const url = item.url || (item.docid ? `https://3g.163.com/touch/article/${item.docid}.html` : null);
                  if (url) items.push({ title: item.title, url });
                }
              }
              return items;
            }

            async function getWallstreet() { /* 已优化 */ 
              const json = await fetchWithUA("https://api-one-wscn.wallstreetcn.com/apiv1/content/lives?channel=global-channel&limit=20", {
                "Origin": "https://wallstreetcn.com", "Referer": "https://wallstreetcn.com/"
              });
              const list = json?.data?.items || [];
              return list.slice(0,5).map(i => ({
                title: (i.title || i.content_text || "").replace(/<[^>]+>/g,"").slice(0,60) + "...",
                url: i.uri || "https://wallstreetcn.com/live/global"
              })).filter(i => i.title.length > 20);
            }

            async function getJiemian() {
              const json = await fetchWithUA("https://www.jiemian.com/api/v1/news/getNewsListByChannel.json?channel_id=1&page=1");
              let list = json?.data?.list || [];
              if (!list.length) list = await fetchWithUA("https://m.jiemian.com/lists/4_1.html") || [];
              return list.slice(0,5).map(i => ({ title: i.title, url: i.ar_url || i.url }));
            }

            async function getEastmoney() {
              const json = await fetchWithUA("https://np-listapi.eastmoney.com/comm/web/getFastNewsList?client=web&biz=web_news&pageIndex=1&pageSize=10", {
                "Referer": "https://kuaixun.eastmoney.com/"
              });
              const list = json?.data?.fastNewsList || json?.Data || [];
              return list.slice(0,5).map(i => ({ title: i.title || i.Title, url: i.url }));
            }

            async function getGithub() { /* 原样 */ 
              const json = await fetchWithUA("https://api.github.com/search/repositories?q=created:>2025-01-01&sort=stars&order=desc&per_page=5");
              const list = json?.items || [];
              return list.slice(0,5).map(i => ({ title: `${i.full_name}: ${i.description?.slice(0,50) || "无描述"}`, url: i.html_url }));
            }

            async function getHuggingFace() { /* 原样 */ 
              const json = await fetchWithUA("https://huggingface.co/api/models?sort=downloads&direction=-1&limit=5");
              return (Array.isArray(json) ? json : []).slice(0,5).map(i => ({ title: `Model: ${i.id}`, url: `https://huggingface.co/${i.id}` }));
            }

            async function getTonghuashun() {
              return [{ title: "同花顺7x24实时快讯", url: "https://news.10jqka.com.cn/realtimenews.html" }];
            }

            async function main() {
              console.log("开始抓取...");
              const results = await Promise.all([
                getBaidu(), getBilibili(), getToutiao(), getIThome(),
                getNetease(), getWallstreet(), getJiemian(), getEastmoney(),
                getGithub(), getHuggingFace(), getTonghuashun()
              ]);

              const keys = ["baidu","bilibili","toutiao","ithome","netease","wallstreet","jiemian","eastmoney","github","huggingface","tonghuashun"];

              const finalData = { updatedAt: new Date().toISOString() };
              keys.forEach((key, i) => {
                if (Array.isArray(results[i]) && results[i].length > 0) finalData[key] = results[i];
              });

              fs.writeFileSync("./hotnews.json", JSON.stringify(finalData, null, 2));
              console.log("完成! 包含:", Object.keys(finalData).filter(k => k !== "updatedAt"));
            }

            main().catch(e => console.error(e));
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data" || exit 0
          git push
