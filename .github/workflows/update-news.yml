name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

          async function fetchWithUA(url, customHeaders = {}) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 8000);
            try {
              const res = await fetch(url, {
                signal: controller.signal,
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  ...customHeaders
                }
              });
              clearTimeout(id);
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              clearTimeout(id);
              return null;
            }
          }

          // 1. 百度热搜
          async function getBaidu() {
            const json = await fetchWithUA("https://top.baidu.com/api/board?tab=realtime");
            const list = json?.data?.cards?.[0]?.content || [];
            return list.slice(0, 5).map(i => ({ title: i.word, url: i.url || `https://www.baidu.com/s?wd=${encodeURIComponent(i.word)}` }));
          }

          // 2. B站热门
          async function getBilibili() {
            const json = await fetchWithUA("https://api.bilibili.com/x/web-interface/popular?ps=5&pn=1");
            const list = json?.data?.list || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.short_link_v2 || i.arcurl || `https://www.bilibili.com/video/${i.bvid}` }));
          }

          // 3. 今日头条热搜 (新增)
          async function getToutiao() {
            const json = await fetchWithUA("https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.Title, url: `https://www.toutiao.com/trending/${i.ClusterIdStr}/` }));
          }

          // 4. IT之家 (修复：加入 Referer 标头)
          async function getIThome() {
            const json = await fetchWithUA("https://m.ithome.com/api/news/getnewslist?type=hotrank", {
              "Referer": "https://m.ithome.com/"
            });
            const list = json?.dataList || json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.title || i.newsTitle, url: i.url || `https://www.ithome.com/0/${Math.floor(i.newsid/1000)}/${i.newsid}.htm` }));
          }

          // 5. 网易新闻 (修复：解析算法优化，提取多条真实新闻)
          async function getNetease() {
            const json = await fetchWithUA("https://c.m.163.com/nc/article/headline/T1348647853363/0-30.html");
            const rawList = json?.T1348647853363 || [];
            const items = [];
            for (const item of rawList) {
              if (item && item.title && !item.skipType && items.length < 5) {
                items.push({
                  title: item.title,
                  url: item.url || `https://3g.163.com/touch/article/${item.docid}.html`
                });
              }
            }
            return items;
          }

          // 6. 华尔街见闻 (新增核心财经)
          async function getWallstreet() {
            const json = await fetchWithUA("https://api-one-wscn.wallstreetcn.com/apiv1/content/lives?channel=global-channel&limit=5");
            const list = json?.data?.items || [];
            return list.slice(0, 5).map(i => ({
              title: i.title || i.content_text?.replace(/<[^>]+>/g, "").slice(0, 30) + "...",
              url: i.uri || "https://wallstreetcn.com/live/global"
            }));
          }

          // 7. 界面新闻 (新增核心财经)
          async function getJiemian() {
            const json = await fetchWithUA("https://a.jiemian.com/index.php?m=lists&a=ajaxNews&page=1");
            const list = json?.data?.rst || json?.rst || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.ar_url || `https://www.jiemian.com/article/${i.id}.html` }));
          }

          // 8. 东方财富快讯 (新增核心财经)
          async function getEastmoney() {
            const json = await fetchWithUA("https://fastcheck.eastmoney.com/api/FastCheck/GetFastNewsList?pageIndex=1&pageSize=5");
            const list = json?.Data || json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.Title || i.title, url: i.Url || "https://kuaixun.eastmoney.com" }));
          }

          // 9. GitHub Trending
          async function getGithub() {
            const json = await fetchWithUA("https://api.github.com/search/repositories?q=created:>2026-01-01&sort=stars&order=desc&per_page=5");
            const list = json?.items || [];
            return list.slice(0, 5).map(i => ({ title: `${i.full_name}: ${i.description || "无描述"}`, url: i.html_url }));
          }

          // 10. Hugging Face
          async function getHuggingFace() {
            const json = await fetchWithUA("https://huggingface.co/api/models?sort=downloads&direction=-1&limit=5");
            const list = Array.isArray(json) ? json : [];
            return list.map(i => ({ title: `Model: ${i.id}`, url: `https://huggingface.co/${i.id}` }));
          }

          async function main() {
            console.log("开始并行抓取精选黄金源...");
            
            const results = await Promise.all([
              getBaidu(), getBilibili(), getToutiao(), getIThome(),
              getNetease(), getWallstreet(), getJiemian(), getEastmoney(),
              getGithub(), getHuggingFace()
            ]);

            const keys = [
              "baidu", "bilibili", "toutiao", "ithome",
              "netease", "wallstreet", "jiemian", "eastmoney",
              "github", "huggingface"
            ];
            
            const finalData = { updatedAt: new Date().toISOString() };

            keys.forEach((key, index) => {
              if (Array.isArray(results[index]) && results[index].length > 0) {
                finalData[key] = results[index];
              }
            });

            console.log("最终成功抓取的源:", Object.keys(finalData).filter(k => k !== "updatedAt"));
            fs.writeFileSync("./hotnews.json", JSON.stringify(finalData, null, 2));
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data" || exit 0
          git push
