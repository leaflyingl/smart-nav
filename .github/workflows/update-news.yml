name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

          // 通用 fetch 工具
          async function fetchWithUA(url, customHeaders = {}) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 8000);
            try {
              const res = await fetch(url, {
                signal: controller.signal,
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  ...customHeaders
                }
              });
              clearTimeout(id);
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              clearTimeout(id);
              return null;
            }
          }

          // 通用 RSS 解析器（极度稳健，自动剥离 CDATA 和 HTML 标签）
          async function fetchRSS(url) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), 8000);
            try {
              const res = await fetch(url, {
                signal: controller.signal,
                headers: { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" }
              });
              clearTimeout(id);
              if (!res.ok) return [];
              const xml = await res.text();
              const items = [];
              const matches = xml.matchAll(/<item>[\s\S]*?<title>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/title>[\s\S]*?<link>(?:<!\[CDATA\[)?(.*?)(?:\]\]>)?<\/link>/g);
              for (const match of matches) {
                if (items.length >= 5) break;
                if (match[1] && match[2]) {
                  let title = match[1].replace(/<!\[CDATA\[|\]\]>/g, "").replace(/<[^>]+>/g, "").trim();
                  let link = match[2].replace(/<!\[CDATA\[|\]\]>/g, "").trim();
                  if (title && title.length > 4) {
                    items.push({ title, url: link });
                  }
                }
              }
              return items;
            } catch (e) {
              clearTimeout(id);
              return [];
            }
          }

          // 1. 百度热搜
          async function getBaidu() {
            const json = await fetchWithUA("https://top.baidu.com/api/board?tab=realtime");
            const list = json?.data?.cards?.[0]?.content || [];
            return list.slice(0, 5).map(i => ({ title: i.word, url: i.url || `https://www.baidu.com/s?wd=${encodeURIComponent(i.word)}` }));
          }

          // 2. B站热门
          async function getBilibili() {
            const json = await fetchWithUA("https://api.bilibili.com/x/web-interface/popular?ps=5&pn=1");
            const list = json?.data?.list || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.short_link_v2 || i.arcurl || `https://www.bilibili.com/video/${i.bvid}` }));
          }

          // 3. 今日头条
          async function getToutiao() {
            const json = await fetchWithUA("https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.Title, url: `https://www.toutiao.com/trending/${i.ClusterIdStr}/` }));
          }

          // 4. IT之家（双重备用：官方 H5 接口 + RSSHub）
          async function getIThome() {
            const json = await fetchWithUA("https://m.ithome.com/api/news/getnewslist?type=hotrank", {
              "Referer": "https://m.ithome.com"
            });
            const list = json?.dataList || json?.data || [];
            if (Array.isArray(list) && list.length > 0) {
              return list.slice(0, 5).map(i => ({
                title: i.title || i.newsTitle,
                url: i.url || `https://www.ithome.com/0/${Math.floor(i.newsid/1000)}/${i.newsid}.htm`
              }));
            }
            return await fetchRSS("https://rsshub.app/ithome/ranking/24h");
          }

          // 5. 网易新闻（使用网易官方新闻 RSS 订阅源，100% 返回 5 条，彻底告别单条现象）
          async function getNetease() {
            return await fetchRSS("https://news.163.com/special/00011K6L/rss_newstop.xml");
          }

          // 6. 华尔街见闻（官方公开 API）
          async function getWallstreet() {
            const json = await fetchWithUA("https://api-one-wscn.wallstreetcn.com/apiv1/content/lives?channel=global-channel&limit=15");
            const list = json?.data?.items || [];
            const res = [];
            for (const i of list) {
              if (res.length >= 5) break;
              let title = i.title || i.content_text || "";
              title = title.replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
              if (title.length > 5) {
                res.push({
                  title: title.length > 32 ? title.slice(0, 32) + "..." : title,
                  url: i.uri || "https://wallstreetcn.com/live/global"
                });
              }
            }
            return res;
          }

          // 7. 界面新闻（RSS 源）
          async function getJiemian() {
            return await fetchRSS("https://rsshub.app/jiemian/news");
          }

          // 8. 东方财富（RSS 源）
          async function getEastmoney() {
            return await fetchRSS("https://rsshub.app/eastmoney/kuaixun");
          }

          // 9. GitHub Trending
          async function getGithub() {
            const json = await fetchWithUA("https://api.github.com/search/repositories?q=created:>2026-01-01&sort=stars&order=desc&per_page=5");
            const list = json?.items || [];
            return list.slice(0, 5).map(i => ({ title: `${i.full_name}: ${i.description || "无描述"}`, url: i.html_url }));
          }

          // 10. Hugging Face
          async function getHuggingFace() {
            const json = await fetchWithUA("https://huggingface.co/api/models?sort=downloads&direction=-1&limit=5");
            const list = Array.isArray(json) ? json : [];
            return list.map(i => ({ title: `Model: ${i.id}`, url: `https://huggingface.co/${i.id}` }));
          }

          async function main() {
            console.log("开始并行抓取全量数据源...");
            
            const results = await Promise.all([
              getBaidu(), getBilibili(), getToutiao(), getIThome(),
              getNetease(), getWallstreet(), getJiemian(), getEastmoney(),
              getGithub(), getHuggingFace()
            ]);

            const keys = [
              "baidu", "bilibili", "toutiao", "ithome",
              "netease", "wallstreet", "jiemian", "eastmoney",
              "github", "huggingface"
            ];
            
            const finalData = { updatedAt: new Date().toISOString() };

            keys.forEach((key, index) => {
              if (Array.isArray(results[index]) && results[index].length > 0) {
                finalData[key] = results[index];
              }
            });

            console.log("最终成功提取的源:", Object.keys(finalData).filter(k => k !== "updatedAt"));
            fs.writeFileSync("./hotnews.json", JSON.stringify(finalData, null, 2));
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data" || exit 0
          git push
