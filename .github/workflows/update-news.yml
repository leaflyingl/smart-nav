name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

async function fetchWithUA(url, customHeaders = {}, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), 10000);
    try {
      const res = await fetch(url, {
        signal: controller.signal,
        headers: {
          "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
          "Accept": "application/json, text/plain, */*",
          "Referer": new URL(url).origin + "/",
          ...customHeaders
        }
      });
      clearTimeout(id);
      if (!res.ok) {
        if (attempt === retries) return null;
        await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
        continue;
      }
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        return text; // 少数情况返回非JSON
      }
    } catch (e) {
      clearTimeout(id);
      if (attempt === retries) return null;
      await new Promise(r => setTimeout(r, 1000 * (attempt + 1)));
    }
  }
  return null;
}

          // 1. 百度热搜
          async function getBaidu() {
            const json = await fetchWithUA("https://top.baidu.com/api/board?tab=realtime");
            const list = json?.data?.cards?.[0]?.content || [];
            return list.slice(0, 5).map(i => ({ title: i.word, url: i.url || `https://www.baidu.com/s?wd=${encodeURIComponent(i.word)}` }));
          }

          // 2. B站热门
          async function getBilibili() {
            const json = await fetchWithUA("https://api.bilibili.com/x/web-interface/popular?ps=5&pn=1");
            const list = json?.data?.list || [];
            return list.slice(0, 5).map(i => ({ title: i.title, url: i.short_link_v2 || i.arcurl || `https://www.bilibili.com/video/${i.bvid}` }));
          }

          // 3. 今日头条热搜
          async function getToutiao() {
            const json = await fetchWithUA("https://www.toutiao.com/hot-event/hot-board/?origin=toutiao_pc");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({ title: i.Title, url: `https://www.toutiao.com/trending/${i.ClusterIdStr}/` }));
          }

          // 4. IT之家 (更换为开放榜单 API + 完整 Header)
          async function getIThome() {
            const json = await fetchWithUA("https://api.ithome.com/json/newslist/news", {
              "Referer": "https://www.ithome.com/"
            });
            let list = json || [];
            if (!Array.isArray(list)) list = json?.newslist || [];
            return list.slice(0, 5).map(i => ({
              title: i.title,
              url: i.url || `https://www.ithome.com/0/${Math.floor(i.newsid/1000)}/${i.newsid}.htm`
            }));
          }

          // 5. 网易新闻 - 加强取前5条
async function getNetease() {
  const json = await fetchWithUA("https://c.m.163.com/nc/article/headline/T1348647853363/0-40.html");
  let rawList = json?.T1348647853363 || [];
  if (!Array.isArray(rawList) && json?.list) rawList = json.list;
  
  const items = [];
  for (const item of rawList) {
    if (!item || !item.title || items.length >= 5) continue;
    if (item.title.includes("广告") || item.title.length < 5) continue; // 过滤垃圾
    const targetUrl = item.url || 
                     (item.docid ? `https://3g.163.com/touch/article/${item.docid}.html` : 
                      `https://news.163.com`);
    items.push({ title: item.title.trim(), url: targetUrl });
  }
  return items;
}

// 6. 华尔街见闻（优化）
async function getWallstreet() {
  const json = await fetchWithUA(
    "https://api-one-wscn.wallstreetcn.com/apiv1/content/lives?channel=global-channel&limit=15", 
    { "Origin": "https://wallstreetcn.com", "Referer": "https://wallstreetcn.com/" }
  );
  const list = json?.data?.items || [];
  const items = [];
  for (const i of list) {
    if (items.length >= 5) break;
    let text = (i.title || i.content_text || "").replace(/<[^>]+>/g, "").trim();
    if (text.length > 10) {
      items.push({ 
        title: text.slice(0, 60) + (text.length > 60 ? "..." : ""), 
        url: i.uri || "https://wallstreetcn.com/live/global" 
      });
    }
  }
  return items;
}

// 7. 界面新闻（新稳定接口）
async function getJiemian() {
  // 尝试多个可能接口
  let json = await fetchWithUA("https://www.jiemian.com/api/v1/news/getNewsListByChannel.json?channel_id=1&page=1");
  if (!json?.data?.list?.length) {
    json = await fetchWithUA("https://m.jiemian.com/lists/4_1.html"); // 快讯页备用
  }
  let list = json?.data?.list || json?.rst || [];
  if (!Array.isArray(list)) list = [];
  
  return list.slice(0, 5).map(i => ({
    title: i.title || i.news_title,
    url: i.ar_url || i.url || `https://www.jiemian.com/article/${i.id || i.news_id}.html`
  }));
}

// 8. 东方财富（优化 Headers）
async function getEastmoney() {
  const json = await fetchWithUA(
    "https://np-listapi.eastmoney.com/comm/web/getFastNewsList?client=web&biz=web_news&pageIndex=1&pageSize=10",
    { "Referer": "https://kuaixun.eastmoney.com/" }
  );
  let list = json?.data?.fastNewsList || json?.Data || json?.list || [];
  return list.slice(0, 5).map(i => ({
    title: (i.title || i.Title || "").trim(),
    url: i.url || `https://kuaixun.eastmoney.com/news/${i.code || i.id}.html`
  }));
}

// 新增：同花顺 7x24
async function getTonghuashun() {
  // 常用公开接口或带UA抓取
  const json = await fetchWithUA("https://news.10jqka.com.cn/realtimenews.html", {}, 3); // 页面
  // 如果是HTML，可用简单正则或改用其他接口；这里简化假设JSON或提取
  // 备用API风格（实际可能需调整）
  const alt = await fetchWithUA("https://www.10jqka.com.cn/", { "Referer": "https://news.10jqka.com.cn/" });
  
  // 实际项目中建议用 cheerio 解析HTML更稳，但Actions纯node可先用字符串匹配
  let items = [];
