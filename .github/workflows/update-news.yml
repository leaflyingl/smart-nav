name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

          // 通用请求工具，模拟真实浏览器 Header
          async function fetchWithUserAgent(url, headers = {}) {
            try {
              const res = await fetch(url, {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
                  "Accept": "application/json, text/plain, */*",
                  ...headers
                }
              });
              if (!res.ok) throw new Error(`HTTP status ${res.status}`);
              return await res.json();
            } catch (e) {
              console.error(`Fetch error for ${url}:`, e.message);
              return null;
            }
          }

          // 1. 直连百度官方热搜
          async function getBaidu() {
            const data = await fetchWithUserAgent("https://top.baidu.com/api/board?tab=realtime");
            const list = data?.data?.cards?.[0]?.content || [];
            return list.slice(0, 5).map(item => ({
              title: item.word || "百度热搜",
              url: item.url || `https://www.baidu.com/s?wd=${encodeURIComponent(item.word)}`
            }));
          }

          // 2. 直连微博官方热搜
          async function getWeibo() {
            const data = await fetchWithUserAgent("https://weibo.com/ajax/side/hotSearch");
            const list = data?.data?.realtime || [];
            return list.slice(0, 5).map(item => ({
              title: item.note || item.word || "微博热搜",
              url: `https://s.weibo.com/weibo?q=${encodeURIComponent(item.word)}`
            }));
          }

          // 3. 直连 B 站官方热门视频榜
          async function getBilibili() {
            const data = await fetchWithUserAgent("https://api.bilibili.com/x/web-interface/popular?ps=5&pn=1");
            const list = data?.data?.list || [];
            return list.slice(0, 5).map(item => ({
              title: item.title || "B站热门",
              url: item.short_link_v2 || item.arcurl || `https://www.bilibili.com/video/${item.bvid}`
            }));
          }

          async function main() {
            console.log("正在直连官方数据源抓取...");
            
            const baidu = await getBaidu();
            const weibo = await getWeibo();
            const bilibili = await getBilibili();

            const result = {
              baidu,
              weibo,
              bilibili,
              updatedAt: new Date().toISOString()
            };

            console.log("抓取到的结果预览:\n", JSON.stringify(result, null, 2));
            fs.writeFileSync("./hotnews.json", JSON.stringify(result, null, 2));
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data" || exit 0
          git push
