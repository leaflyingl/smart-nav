name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

          async function fetchNews(url) {
            try {
              const res = await fetch(url, { headers: { "User-Agent": "Mozilla/5.0" } });
              const json = await res.json();
              
              // 兼容 TenApi (code: 200, data: [])
              if (json.code === 200 && Array.isArray(json.data)) {
                return json.data.slice(0, 5).map(i => ({
                  title: i.name || i.title || "最新热点",
                  url: i.url || i.link || "#"
                }));
              }
              // 兼容 Vvhan (success: true, data: [])
              if (json.success && Array.isArray(json.data)) {
                return json.data.slice(0, 5).map(i => ({
                  title: i.title || i.name || "最新热点",
                  url: i.url || i.link || "#"
                }));
              }
            } catch (e) {
              console.error(`Fetch error for ${url}:`, e.message);
            }
            return [];
          }

          async function main() {
            const data = {
              baidu: await fetchNews("https://tenapi.cn/v2/baiduhot"),
              weibo: await fetchNews("https://tenapi.cn/v2/weibohot"),
              bilibili: await fetchNews("https://tenapi.cn/v2/bilibilihot"),
              updatedAt: new Date().toISOString()
            };

            console.log("抓取到的数据预览:", JSON.stringify(data, null, 2));
            fs.writeFileSync("./hotnews.json", JSON.stringify(data, null, 2));
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data" || exit 0
          git push
