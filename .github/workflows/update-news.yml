name: Auto Update Hot News

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Build hotnews.json
        run: |
          node -e '
          const fs = require("fs");

          async function fetchWithUA(url) {
            try {
              const res = await fetch(url, {
                headers: {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
                }
              });
              if (!res.ok) return null;
              return await res.json();
            } catch (e) {
              return null;
            }
          }

          // 1. 百度热搜
          async function getBaidu() {
            const json = await fetchWithUA("https://top.baidu.com/api/board?tab=realtime");
            const list = json?.data?.cards?.[0]?.content || [];
            return list.slice(0, 5).map(i => ({
              title: i.word,
              url: i.url || `https://www.baidu.com/s?wd=${encodeURIComponent(i.word)}`
            }));
          }

          // 2. B站热门
          async function getBilibili() {
            const json = await fetchWithUA("https://api.bilibili.com/x/web-interface/popular?ps=5&pn=1");
            const list = json?.data?.list || [];
            return list.slice(0, 5).map(i => ({
              title: i.title,
              url: i.short_link_v2 || i.arcurl || `https://www.bilibili.com/video/${i.bvid}`
            }));
          }

          // 3. 知乎热榜 (开放API)
          async function getZhihu() {
            const json = await fetchWithUA("https://www.zhihu.com/api/v4/creators/rank/hot?domain=0&limit=5");
            const list = json?.data || [];
            return list.slice(0, 5).map(i => ({
              title: i.question?.title || i.title || "知乎讨论",
              url: i.question?.url ? `https://www.zhihu.com/question/${i.question.id}` : "https://www.zhihu.com"
            }));
          }

          // 4. 36氪 (科技)
          async function get36Kr() {
            const json = await fetchWithUA("https://36kr.com/pp/api/info-flow/mstation/home");
            const list = json?.data?.itemList || [];
            return list.filter(i => i.templateMaterial?.widgetTitle).slice(0, 5).map(i => ({
              title: i.templateMaterial.widgetTitle,
              url: `https://36kr.com/p/${i.itemId}`
            }));
          }

          // 5. IT之家 (科技)
          async function getIThome() {
            const json = await fetchWithUA("https://m.ithome.com/api/news/getnewslist?type=hotrank");
            const list = json?.dataList || json?.data || [];
            return list.slice(0, 5).map(i => ({
              title: i.title || i.newsTitle,
              url: i.url || `https://www.ithome.com/0/${Math.floor(i.newsid/1000)}/${i.newsid}.htm`
            }));
          }

          async function main() {
            console.log("开始并行抓取多源...");
            
            const [baidu, bilibili, zhihu, kr36, ithome] = await Promise.all([
              getBaidu(),
              getBilibili(),
              getZhihu(),
              get36Kr(),
              getIThome()
            ]);

            const result = {
              baidu,
              bilibili,
              zhihu,
              kr36,
              ithome,
              updatedAt: new Date().toISOString()
            };

            console.log("有效的抓取源结果:", Object.keys(result).filter(k => Array.isArray(result[k]) && result[k].length > 0));
            fs.writeFileSync("./hotnews.json", JSON.stringify(result, null, 2));
          }

          main();
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hotnews.json
          git commit -m "chore: auto update hot news data" || exit 0
          git push
