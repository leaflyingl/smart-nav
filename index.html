    <!-- 弹窗模态框 (保持原结构) -->
    <div id="modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[300]" onclick="closeModalOnBlank(event)">
        <div class="bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-sm" onclick="event.stopPropagation()">
            <h4 id="modal-title" class="text-md font-semibold text-slate-200 mb-4 flex items-center">
                <i class="fas fa-link mr-2 text-indigo-400"></i><span id="modal-title-text">添加网址</span>
            </h4>
            <div class="space-y-4 mb-6">
                <input type="text" id="site-name" placeholder="网站名称" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100">
                <input type="text" id="site-url" placeholder="www.example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100">
            </div>
            <div class="flex justify-end space-x-3">
                <button onclick="toggleModal(false)" class="px-4 py-2 text-slate-400 text-xs">取消</button>
                <button onclick="saveActiveLink()" class="px-4 py-2 bg-indigo-600 text-white text-xs rounded-xl">保存站点</button>
            </div>
        </div>
    </div>

    <script>
        // --- 核心逻辑修改：统一编辑功能 ---
        let editingIndex = null;
        let editingSecId = null;

        // 修改后的打开弹窗函数
        function openLinkModal(target, index = null, secId = null) {
            currentModalTarget = target;
            editingIndex = index;
            editingSecId = secId;
            
            const titleText = document.getElementById('modal-title-text');
            const nameInput = document.getElementById('site-name');
            const urlInput = document.getElementById('site-url');

            if (index !== null) {
                // 编辑模式：获取现有数据
                let linkData;
                if (secId) {
                    const sec = cloudConfig.dynamicSections.find(s => s.id === secId);
                    linkData = sec.links[index];
                } else if (target === 'friend') {
                    linkData = JSON.parse(localStorage.getItem('nav_friend_links'))[index];
                } else {
                    linkData = JSON.parse(localStorage.getItem('nav_custom_links'))[index];
                }
                nameInput.value = linkData.name;
                urlInput.value = linkData.url;
                titleText.innerText = "编辑网址";
            } else {
                // 新增模式
                nameInput.value = '';
                urlInput.value = '';
                titleText.innerText = "添加网址";
            }
            toggleModal(true);
        }

        // 修改后的保存函数
        async function saveActiveLink() {
            const name = document.getElementById('site-name').value.trim();
            let url = document.getElementById('site-url').value.trim();
            if(!name || !url) return alert('请完整填写！');
            if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

            const linkItem = { name, url };

            if (editingSecId) {
                // 保存到动态区域
                let secs = cloudConfig.dynamicSections;
                const sec = secs.find(s => s.id === editingSecId);
                if (editingIndex !== null) sec.links[editingIndex] = linkItem;
                else sec.links.push(linkItem);
                saveDynamicSections(secs);
            } else if (currentModalTarget === 'friend') {
                // 保存到友情链接
                let links = JSON.parse(localStorage.getItem('nav_friend_links') || '[]');
                if (editingIndex !== null) links[editingIndex] = linkItem;
                else links.push(linkItem);
                localStorage.setItem('nav_friend_links', JSON.stringify(links));
                loadFriendLinks();
            } else {
                // 保存到云端站长推荐
                let links = JSON.parse(localStorage.getItem('nav_custom_links') || '[]');
                if (editingIndex !== null) links[editingIndex] = linkItem;
                else links.push(linkItem);
                try {
                    await fetch('/api/links', { method: 'POST', body: JSON.stringify(links) });
                    localStorage.setItem('nav_custom_links', JSON.stringify(links));
                    loadCustomLinks();
                } catch(e) { alert('同步失败，已保存至本地'); }
            }
            toggleModal(false);
        }

        // 修改渲染函数中的按钮部分 (以站长推荐为例)
        // 在 loadCustomLinks 循环生成时，确保 pr-16 存在，且按钮包含编辑图标
        // ... (此处省略部分重复渲染代码，重点如下)
